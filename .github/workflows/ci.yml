name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          archive=beads_1.3.4_linux_amd64.tar.gz
          gh release download v1.3.4 --repo gastownhall/beads --pattern "$archive" --pattern checksums.txt
          grep -F "  $archive" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" bd
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check (bun fmt --check)
        run: bun fmt --check

      - name: Typecheck (bun check)
        run: bun check

      - name: Tests (real bd, no mocks)
        run: bun test

      # Platform check: Bun must resolve @vercel/board's node export condition (U1 decision point).
      - name: Platform check
        run: bun run verify:platform

      - name: Build
        run: bun run build

      # U8 makes conformance required for main and PRs. Release tags already require it.
      - name: Conformance suite
        run: bun run conformance
        continue-on-error: ${{ github.ref_type != 'tag' }}
